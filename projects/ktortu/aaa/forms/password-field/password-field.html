<kt-field
  [label]="label()"
  [hint]="hint()"
  [helpText]="helpText()"
  [helpLabel]="helpLabel()"
  [customDescribedBy]="customDescribedBy()"
  [errors]="displayErrors()"
  [invalid]="showInvalid()"
  [required]="required()"
  [fieldId]="inputId()"
  [appearance]="appearance()"
  [floatLabel]="floatLabel()"
  (helpClick)="helpClick.emit($event)"
>
  <ng-content select="[ktFieldHelp]" />
  <div
    class="kt-field-box"
    [attr.data-invalid]="showInvalid() ? '' : null"
    [attr.data-disabled]="disabled() ? '' : null"
    [attr.data-pending]="pending() ? '' : null"
  >
    @if (icon(); as icon) {
      <span class="kt-field-box__icon" aria-hidden="true">{{ icon }}</span>
    }

    @if (prefix(); as prefix) {
      <span class="kt-field-box__affix">
        @if (asTemplate(prefix); as tpl) {
          <ng-container [ngTemplateOutlet]="tpl" />
        } @else {
          {{ asText(prefix) }}
        }
      </span>
    }

    <input
      #input
      ktFieldControl
      class="kt-field-box__input"
      [type]="inputType()"
      [value]="value()"
      [disabled]="disabled()"
      [readOnly]="readonly()"
      [attr.aria-busy]="pending() ? 'true' : null"
      [attr.name]="name() || null"
      [attr.placeholder]="placeholderAttr()"
      [attr.autocomplete]="resolvedAutocomplete()"
      [attr.minlength]="minLength() ?? null"
      [attr.maxlength]="maxLength() ?? null"
      [attr.pattern]="patternAttr()"
      (keydown)="onKeyDown($event)"
      (input)="onInput($event)"
      (blur)="touched.set(true)"
    />

    @if (showClear()) {
      <button type="button" class="kt-field-box__clear" [attr.aria-label]="clearLabel()" (click)="clear()">
        <span class="kt-field-box__icon" aria-hidden="true">close</span>
      </button>
    }

    <button
      type="button"
      class="kt-field-box__toggle"
      [disabled]="disabled() || readonly()"
      [attr.aria-label]="isPasswordVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
      [attr.aria-controls]="inputId()"
      (mousedown)="toggleVisibility($event)"
    >
      <span class="kt-field-box__icon" aria-hidden="true">
        {{ isPasswordVisible() ? 'visibility_off' : 'visibility' }}
      </span>
    </button>

    @if (suffix(); as suffix) {
      <span class="kt-field-box__affix">
        @if (asTemplate(suffix); as tpl) {
          <ng-container [ngTemplateOutlet]="tpl" />
        } @else {
          {{ asText(suffix) }}
        }
      </span>
    }
  </div>
</kt-field>
