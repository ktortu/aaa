<kt-layout desktopCloseBehavior="rail">
  <kt-sidenav>
    <a class="shell__brand" routerLink="/">
      <span class="shell__brand-mark">aaa</span>
      <!-- Hide text in rail mode -->
      <span class="shell__brand-name" [style.display]="layout.isRail() ? 'none' : 'block'">&#64;ktortu/aaa</span>
    </a>
    <nav class="shell__nav" aria-label="Composants">
      @for (item of nav; track item.link) {
        <a
          class="shell__link"
          [routerLink]="item.link"
          [routerLinkActiveOptions]="{ exact: item.path === '' }"
          routerLinkActive="shell__link--active"
        >
          <kt-nav-item [label]="item.label">
            <!-- kt-icon (attribut) aiguille la projection vers le slot du nav-item ; [ktIcon] (directive)
                 peint le glyphe. La police/graisse vient du provideKtIcon racine (app.config.ts). -->
            <span kt-icon [ktIcon]="item.icon ?? ''" size="24px"></span>
          </kt-nav-item>
        </a>
      }
    </nav>

    <div
      class="hide-on-mobile"
      style="
        margin-top: auto;
        border-top: 1px solid var(--kt-outline);
        padding: 0.5rem;
        display: flex;
        justify-content: center;
      "
    >
      <button
        ktButton
        iconOnly
        ktSidenavToggle
        #btn="ktSidenavToggle"
        [icon]="btn.isRail() ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left'"
        [ariaLabel]="btn.isRail() ? 'Agrandir le menu' : 'Réduire le menu'"
        mode="text"
      ></button>
    </div>
  </kt-sidenav>

  <kt-toolbar>
    <button class="hide-on-desktop" ktButton iconOnly icon="menu" ariaLabel="Menu" mode="text" ktSidenavToggle></button>
    <h1 class="shell__page-title" style="margin-left: 16px; flex: 1">{{ pageTitle() }}</h1>
    <button ktButton mode="text" iconOnly icon="palette" ariaLabel="Apparence" (click)="openThemeDialog()"></button>
  </kt-toolbar>

  <router-outlet />
</kt-layout>
