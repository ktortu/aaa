name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs précédents d'une même branche/PR encore en cours
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  lint-test:
    name: Lint, build & unit (gate couverture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check circular dependencies
        run: npm run lint:circular

      - name: Format check
        run: npm run format:check

      - name: Build lib
        run: npm run build:lib

      - name: Unit tests + gate couverture
        run: npm run test:ci

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Un job par projet Playwright : les runners n'ont que 2 cœurs (1 worker Playwright), une
  # suite 4-navigateurs en série y dépasse les 40 min — la matrice ramène le wall-clock au shard
  # le plus lent. `timeout-minutes` borne les blocages (un locator qui pend × retries × 15 tests
  # a déjà coûté des runs d'1 h+). webkit réintégré : le crash au boot (Temporal non polyfillé)
  # est corrigé par la résolution paresseuse du proxy Temporal.
  e2e:
    name: E2E ${{ matrix.project }} (+ axe)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile # viewport tactile 390×844, moteur chromium
            browser: chromium
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build lib
        run: npm run build:lib

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}
        timeout-minutes: 25

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
